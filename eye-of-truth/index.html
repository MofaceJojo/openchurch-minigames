<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Eye of Truth · 真理之眼 — OpenChurch Games</title>
<meta name="description" content="Spot the deceivers hiding among the innocent. A gentle sniper game of discernment.">
<meta name="theme-color" content="#2a3a28">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23047857'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23f5e6c8' stroke-width='2.2'/%3E%3Cline x1='16' y1='8' x2='16' y2='24' stroke='%23f5e6c8' stroke-width='1.6'/%3E%3Cline x1='8' y1='16' x2='24' y2='16' stroke='%23f5e6c8' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#2a3a28;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Roboto,sans-serif}
body{display:flex;flex-direction:column;touch-action:none;-webkit-user-select:none;user-select:none}
#back{
  position:fixed;top:10px;left:10px;z-index:10;
  font:600 14px/1 -apple-system,"Segoe UI","PingFang SC",sans-serif;color:#e8dcc8;
  background:rgba(30,30,25,.7);backdrop-filter:blur(4px);
  border:1px solid rgba(200,180,150,.2);border-radius:999px;padding:8px 14px;text-decoration:none;
}
#mute{
  position:fixed;top:10px;right:10px;z-index:10;
  width:38px;height:38px;border-radius:999px;
  border:1px solid rgba(200,180,150,.18);background:rgba(30,30,25,.7);backdrop-filter:blur(4px);
  font-size:17px;color:#e8dcc8;cursor:pointer;
}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px}
canvas{border-radius:16px;box-shadow:0 6px 28px rgba(0,0,0,.35);touch-action:none;display:block}

/* Bottom bar: scan + fire */
#bar{
  flex:0 0 auto;height:16vh;min-height:80px;max-height:130px;
  display:flex;align-items:center;justify-content:center;gap:16px;
  padding:0 12px calc(env(safe-area-inset-bottom,0)+8px);
}
#scanBtn,#fireBtn{
  border:none;border-radius:999px;font-weight:700;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  user-select:none;touch-action:none;cursor:pointer;
  transition:transform .08s,box-shadow .08s;
}
#scanBtn{
  width:min(36vw,150px);height:min(13vw,54px);
  background:linear-gradient(135deg,#3a7a5a,#2a6a4a);color:#e8f0e0;
  font-size:min(5vw,20px);box-shadow:0 4px 0 #1a4a32,0 6px 14px rgba(0,0,0,.3);
}
#scanBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1a4a32,0 3px 8px rgba(0,0,0,.3)}
#scanBtn:disabled{opacity:.45;transform:translateY(2px);box-shadow:0 2px 0 #1a4a32}
#fireBtn{
  width:min(40vw,170px);height:min(15vw,62px);
  background:linear-gradient(135deg,#d4773a,#c06430);color:#fff5e6;
  font-size:min(6vw,24px);box-shadow:0 5px 0 #904a20,0 8px 18px rgba(0,0,0,.35);
}
#fireBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #904a20,0 3px 8px rgba(0,0,0,.3)}

/* score/timer overlay on canvas */
#hud{
  position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:8;
  display:flex;gap:20px;pointer-events:none;
  font-size:min(4vw,16px);font-weight:600;color:#e8dcc8;
  text-shadow:0 2px 6px rgba(0,0,0,.7);
}
#hud span{background:rgba(20,20,15,.55);backdrop-filter:blur(3px);padding:4px 12px;border-radius:999px}
#hud .scan-count{background:rgba(40,100,70,.55)}
</style>
</head>
<body>

<a id="back" href="../">← All games</a>
<button id="mute" aria-label="Sound">♪</button>

<div id="hud">
  <span id="scoreDisplay">Score: 0</span>
  <span id="timerDisplay">⏱ 60</span>
  <span id="scanDisplay" class="scan-count">🔍 ×3</span>
</div>

<div id="stage"><canvas id="cv"></canvas></div>

<div id="bar">
  <button id="scanBtn">🔍 Scan</button>
  <button id="fireBtn">🎯 Fire!</button>
</div>

<script>
"use strict";

/* =============================
   EYE OF TRUTH  ·  真理之眼
   A spotting / sniper game
   ============================= */

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const dpr = Math.min(2, window.devicePixelRatio || 1);
const stage = document.getElementById("stage");
const scoreEl = document.getElementById("scoreDisplay");
const timerEl = document.getElementById("timerDisplay");
const scanEl = document.getElementById("scanDisplay");
const scanBtn = document.getElementById("scanBtn");
const fireBtn = document.getElementById("fireBtn");

// ============= AUDIO =============
const Audio = (()=>{
  let actx = null, muted = false;
  function ctx(){
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    return actx;
  }
  function gain(v){
    const g = ctx().createGain(); g.gain.value = v;
    g.connect(ctx().destination); return g;
  }
  function shoot(){
    const ac = ctx(), g = gain(.18);
    const o = ac.createOscillator(); o.type="sawtooth"; o.frequency.setValueAtTime(600,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(200,ac.currentTime+.09);
    const n = ac.createOscillator(); n.type="square"; n.frequency.setValueAtTime(900,ac.currentTime);
    n.frequency.exponentialRampToValueAtTime(400,ac.currentTime+.06);
    const gn = ac.createGain(); gn.gain.value=.06;
    n.connect(gn); gn.connect(g);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+.1);
    n.start(); n.stop(ac.currentTime+.08);
  }
  function hit(){
    const ac = ctx(), g = gain(.22);
    const o = ac.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(880,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(1760,ac.currentTime+.08);
    o.frequency.exponentialRampToValueAtTime(1320,ac.currentTime+.18);
    o.connect(g);
    o.start(); o.stop(ac.currentTime+.2);
  }
  function miss(){
    const ac = ctx(), g = gain(.15);
    const o = ac.createOscillator(); o.type="triangle";
    o.frequency.setValueAtTime(200,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(80,ac.currentTime+.15);
    o.connect(g);
    o.start(); o.stop(ac.currentTime+.2);
  }
  function harm(){
    const ac = ctx(), g = gain(.25);
    const o = ac.createOscillator(); o.type="square";
    o.frequency.setValueAtTime(150,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(60,ac.currentTime+.25);
    const o2 = ac.createOscillator(); o2.type="sawtooth";
    o2.frequency.setValueAtTime(180,ac.currentTime);
    o2.frequency.exponentialRampToValueAtTime(50,ac.currentTime+.2);
    const g2 = ac.createGain(); g2.gain.value=.08;
    o2.connect(g2); g2.connect(g);
    o.connect(g);
    o.start(); o.stop(ac.currentTime+.3); o2.start(); o2.stop(ac.currentTime+.3);
  }
  function scan(){
    const ac = ctx(), g = gain(.12);
    const o = ac.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(1200,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(2400,ac.currentTime+.2);
    o.frequency.exponentialRampToValueAtTime(1200,ac.currentTime+.4);
    const o2 = ac.createOscillator(); o2.type="sine";
    o2.frequency.setValueAtTime(1600,ac.currentTime+.05);
    o2.frequency.exponentialRampToValueAtTime(2800,ac.currentTime+.25);
    const g2 = ac.createGain(); g2.gain.value=.06;
    o2.connect(g2); g2.connect(g);
    o.connect(g);
    o.start(); o.stop(ac.currentTime+.45); o2.start(); o2.stop(ac.currentTime+.35);
  }
  function chime(){
    const ac = ctx(), g = gain(.15);
    const notes = [880,1100,1320];
    notes.forEach((f,i)=>{
      const o = ac.createOscillator(); o.type="sine";
      o.frequency.value=f;
      const gg = ac.createGain(); gg.gain.value=.06;
      gg.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25+.1*i);
      o.connect(gg); gg.connect(g);
      o.start(ac.currentTime+.05*i); o.stop(ac.currentTime+.35+.1*i);
    });
  }
  function tap(){ const ac=ctx(),g=gain(.06); const o=ac.createOscillator(); o.type="sine"; o.frequency.value=660; o.connect(g); o.start(); o.stop(ac.currentTime+.04); }
  function play(fn){ if(!muted) try{ fn(); }catch(e){} }
  return { shoot:()=>play(shoot), hit:()=>play(hit), miss:()=>play(miss),
           harm:()=>play(harm), scan:()=>play(scan),
           chime:()=>play(chime), tap:()=>play(tap),
           setMuted:m=>{muted=m}, isMuted:()=>muted };
})();

// ============= LEVEL DATA =============
const LEVELS = [
  {
    id:1, name:"Village Green",
    bg:{ sky:"#c8e0f0", ground:"#88b868", ground2:"#78a858", buildings:["#c8b090","#b09878","#d8c0a0"], trees:["#5a9a4a","#4a8a3a"] },
    innocents:2, deceivers:2, time:75, scans:3,
    treeCount:3, weather:"sunny",
    decorate:{ fences:true, well:true, bushes:true }
  },
  {
    id:2, name:"Market Street",
    bg:{ sky:"#d8e8f0", ground:"#b0a088", ground2:"#a09078", buildings:["#d0b898","#c0a888","#e0c8a8","#b09878"], trees:["#6a8a4a","#5a7a3a"] },
    innocents:4, deceivers:4, time:60, scans:2,
    treeCount:2, weather:"cloudy",
    decorate:{ stalls:true, crates:true, lamps:true, road:true }
  },
  {
    id:3, name:"Harvest Field",
    bg:{ sky:"#f0e8c8", ground:"#c8b050", ground2:"#b8a040", buildings:["#b0a080","#c0a860"], trees:["#7a9a4a","#6a8a3a"] },
    innocents:5, deceivers:5, time:55, scans:2,
    treeCount:0, weather:"windy",
    decorate:{ haybales:true, windmill:true, fence:true }
  },
  {
    id:4, name:"Cathedral Square",
    bg:{ sky:"#d0d8e8", ground:"#b8b0a0", ground2:"#a8a090", buildings:["#c8b8a8","#b8a898","#d0c0b0","#a89888"], trees:["#5a7a4a","#4a6a3a"] },
    innocents:5, deceivers:6, time:50, scans:1,
    treeCount:4, weather:"misty",
    decorate:{ fountain:true, pillars:true, benches:true }
  },
  {
    id:5, name:"The Deceiver's Nest",
    bg:{ sky:"#4a3050", ground:"#5a4050", ground2:"#4a3848", buildings:["#6a5060","#5a4850","#7a5860"], trees:["#3a5040","#2a4030"] },
    innocents:4, deceivers:8, time:55, scans:3,
    treeCount:2, weather:"dark",
    decorate:{ nests:true, mist:true }
  }
];

// ============= GAME STATE =============
let G = {
  mode:"menu",          // menu | intro | play | clear | dead | victory
  level:0,
  score:0,
  timeLeft:60,
  scansLeft:2,
  totalShots:0,
  hits:0,
  innocentsHit:0,
  characters:[],
  scopeX:-1000,
  scopeY:-1000,
  scopeR:80,
  scanActive:0,         // countdown for scan reveal
  scanTimer:0,
  bulletTrail:null,     // {x1,y1,x2,y2,life}
  shake:{x:0,y:0,life:0},
  flash:0,              // red flash overlay
  messages:[],          // floating messages {text,x,y,life,color}
  // camera offset for level 5 shake
  cam:{x:0,y:0},
  // timing
  introT:0,
  deadT:0,
  clearT:0,
  victoryT:0,
  lastShot:0,           // cooldown
  // difficulty multiplier
  diff:1
};

// ============= CANVAS SIZING =============
let W, H, px;

function fit(){
  const sw = stage.clientWidth - 12, sh = stage.clientHeight - 12;
  const ratio = 4/3;
  let w = sw, h = w/ratio;
  if(h > sh){ h = sh; w = h*ratio; }
  w = Math.max(260, Math.floor(w));
  h = Math.max(195, Math.floor(h));
  px = Math.floor(w/28);
  const pw = 28*px, ph = Math.floor(21*px);
  cv.width = pw*dpr; cv.height = ph*dpr;
  cv.style.width = pw+"px"; cv.style.height = ph+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  W = pw; H = ph;
  G.scopeR = Math.max(40, Math.min(90, px*3.5));
}
fit(); addEventListener("resize", fit);

// ============= CHARACTER GENERATION =============
function spawnLevel(idx){
  G.scopeX = W/2; G.scopeY = H/2;
  const L = LEVELS[idx];
  if(!L) return;
  G.timeLeft = L.time * G.diff;
  G.scansLeft = L.scans;
  G.characters = [];
  G.scanActive = 0;
  G.bulletTrail = null;
  G.shake = {x:0,y:0,life:0};
  G.flash = 0;
  G.messages = [];

  const margin = px*2;
  const areaW = W - margin*2, areaH = H - margin*2;
  const allCount = L.innocents + L.deceivers;

  // Generate positions that don't overlap
  const positions = [];
  const minDist = px*3;
  for(let tries=0, guard=0; positions.length<allCount && guard<500; guard++){
    const x = margin + Math.random()*areaW;
    const y = margin*1.5 + Math.random()*(areaH - margin*0.5);
    let ok = true;
    for(const p of positions){
      const dx = x-p.x, dy = y-p.y;
      if(dx*dx+dy*dy < minDist*minDist){ ok=false; break; }
    }
    if(ok) positions.push({x,y});
  }

  // Assign types: first innocents, then deceivers
  const types = [];
  for(let i=0;i<L.innocents;i++) types.push("villager");
  for(let i=0;i<L.deceivers;i++) types.push("deceiver");
  // Shuffle
  for(let i=types.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [types[i],types[j]]=[types[j],types[i]]; }

  // Generate character palettes
  const warmSkin = ["#f5d6b8","#e8c8a8","#f0d0b0","#ecc8a0","#f5dcc0","#e0c0a0"];
  const warmClothes = ["#5a8ab0","#b08050","#6aa060","#a06040","#7a6a50","#c07050","#8a7050","#509070"];
  const innocentColors = ["#d4a080","#c89870","#dcb090","#c89068","#d8a888","#e0b898"];

  function sampleFrom(palette){ return palette[Math.random()*palette.length|0]; }

  for(let i=0;i<types.length&&i<positions.length;i++){
    const isDeceiver = types[i]==="deceiver";
    const p = positions[i];

    // For deceivers: determine camouflage colors based on position in the scene
    let skinColor, clothColor, hairColor;
    if(isDeceiver){
      // Camouflage: pick colors from the background palette
      const bgPalette = [...L.bg.buildings, ...L.bg.trees, L.bg.ground, L.bg.ground2];
      skinColor = sampleFrom(bgPalette);
      clothColor = sampleFrom(bgPalette);
      hairColor = sampleFrom(bgPalette);
    } else {
      skinColor = sampleFrom(innocentColors);
      clothColor = sampleFrom(warmClothes);
      hairColor = ["#5a3a20","#4a2a10","#6a4a30","#3a2a10","#7a5a30","#2a1a08"][Math.random()*6|0];
    }

    G.characters.push({
      x:p.x, y:p.y,
      baseX:p.x, baseY:p.y,
      type: types[i],
      skin: skinColor,
      cloth: clothColor,
      hair: hairColor,
      innocent: !isDeceiver,
      dead: false,
      revealed: false,    // true when scanned
      bobPhase: Math.random()*Math.PI*2,
      bobSpeed: 1.5 + Math.random()*1.0,
      hitboxR: px*1.8,
      // innocent blinks
      blinkTimer: Math.random()*3,
      blinkDur: 0
    });
  }
}

// ============= DRAWING =============

function drawRect(x,y,w,h,color){ ctx.fillStyle=color; ctx.fillRect(x,y,w,h); }

function drawLevelBg(L){
  // Sky
  drawRect(0,0,W,H*0.6,L.bg.sky);
  // Ground
  drawRect(0,H*0.6,W,H*0.4,L.bg.ground);
  drawRect(0,H*0.88,W,H*0.12,L.bg.ground2);

  // Decorative elements per level
  const dec = L.decorate;
  if(dec.road){
    // Road/path through the scene
    ctx.fillStyle = "#c8b898";
    ctx.fillRect(0, H*0.64, W, px*1.5);
    ctx.fillStyle = "#b8a888";
    ctx.fillRect(0, H*0.64+px*0.3, W, px*0.9);
  }
  if(dec.fences){
    // Simple fence
    ctx.strokeStyle="#8a7a5a"; ctx.lineWidth=px*0.35;
    for(let x=px*3; x<W-px*2; x+=px*4){
      ctx.beginPath(); ctx.moveTo(x,H*0.68); ctx.lineTo(x,H*0.72); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(px*2,H*0.70); ctx.lineTo(W-px*2,H*0.70); ctx.stroke();
  }
  if(dec.well){
    const wx=W*0.15, wy=H*0.72, r=px*1.5;
    ctx.fillStyle="#b0a090"; ctx.beginPath(); ctx.arc(wx,wy,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#8a7a6a"; ctx.beginPath(); ctx.arc(wx,wy,r*0.6,0,Math.PI*2); ctx.fill();
    // roof
    ctx.fillStyle="#c8b098"; ctx.beginPath(); ctx.moveTo(wx-r*1.8,wy-r*1.2);
    ctx.lineTo(wx+r*1.8,wy-r*1.2); ctx.lineTo(wx+r*2.2,wy-r*0.4); ctx.lineTo(wx-r*2.2,wy-r*0.4); ctx.fill();
  }
  if(dec.stalls){
    // Market stalls
    ctx.fillStyle="#c0a878";
    ctx.fillRect(W*0.12,H*0.64,px*8,px*5);
    ctx.fillRect(W*0.55,H*0.66,px*7,px*4.5);
    // Stall roof
    ctx.fillStyle="#d0b888";
    ctx.beginPath(); ctx.moveTo(W*0.10,H*0.62); ctx.lineTo(W*0.12+px*8,H*0.62);
    ctx.lineTo(W*0.12+px*9,H*0.58); ctx.lineTo(W*0.10,H*0.58); ctx.fill();
  }
  if(dec.haybales){
    for(let i=0;i<4;i++){
      const bx=W*(0.2+i*0.2), by=H*0.74, r=px*1.2;
      ctx.fillStyle="#d0b050";
      ctx.beginPath(); ctx.arc(bx,by,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#c0a040";
      ctx.beginPath(); ctx.arc(bx,by,r*0.7,0,Math.PI*2); ctx.fill();
    }
  }
  if(dec.windmill){
    const mx=W*0.85, my=H*0.55;
    // Body
    ctx.fillStyle="#b0a080";
    ctx.beginPath(); ctx.moveTo(mx-px*2,my+px*6); ctx.lineTo(mx+px*2,my+px*6);
    ctx.lineTo(mx+px*1.5,my); ctx.lineTo(mx-px*1.5,my); ctx.fill();
    // Roof
    ctx.fillStyle="#c0a860";
    ctx.beginPath(); ctx.moveTo(mx-px*2.2,my); ctx.lineTo(mx+px*2.2,my);
    ctx.lineTo(mx,my-px*2); ctx.fill();
    // Blades
    ctx.strokeStyle="#8a7a5a"; ctx.lineWidth=px*0.3;
    for(let a=0;a<4;a++){
      const ang = a*Math.PI/2 + G.timeLeft*0.3;
      ctx.beginPath(); ctx.moveTo(mx,my);
      const ex=mx+Math.cos(ang)*px*5, ey=my+Math.sin(ang)*px*5;
      ctx.lineTo(ex,ey); ctx.stroke();
    }
  }
  if(dec.fountain){
    const fx=W*0.5, fy=H*0.68;
    ctx.fillStyle="#a0b0c0";
    ctx.beginPath(); ctx.arc(fx,fy,px*2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#8090a0";
    ctx.beginPath(); ctx.arc(fx,fy,px*1.5,0,Math.PI*2); ctx.fill();
    // Water
    ctx.fillStyle="rgba(150,200,230,0.3)";
    ctx.beginPath(); ctx.arc(fx,fy,px*2,0,Math.PI*2); ctx.fill();
  }
  if(dec.pillars){
    ctx.fillStyle="#b0a898";
    ctx.fillRect(W*0.25,H*0.56,px*1.5,px*5);
    ctx.fillRect(W*0.72,H*0.56,px*1.5,px*5);
  }
  if(dec.nests){
    // Dark nest structures
    ctx.fillStyle="#3a2838";
    ctx.beginPath();
    ctx.arc(W*0.18,H*0.48,px*3,0,Math.PI*2); ctx.fill();
    ctx.arc(W*0.78,H*0.42,px*2.8,0,Math.PI*2); ctx.fill();
    ctx.arc(W*0.5,H*0.32,px*3.5,0,Math.PI*2); ctx.fill();
    // Glowing eyes inside nests
    ctx.fillStyle="rgba(255,60,60,0.15)";
    ctx.beginPath(); ctx.arc(W*0.18,H*0.48,px*2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(W*0.78,H*0.42,px*1.8,0,Math.PI*2); ctx.fill();
  }
  if(dec.mist){
    // Low opacity mist overlay
    const grad = ctx.createRadialGradient(W*0.3,H*0.6,0,W*0.3,H*0.6,W*0.6);
    grad.addColorStop(0,"rgba(80,60,90,0.12)");
    grad.addColorStop(1,"rgba(80,60,90,0)");
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  }

  // Buildings (background layer)
  const bs = L.bg.buildings;
  for(let i=0;i<bs.length;i++){
    const bx = W*(0.05 + i*0.28), bw = px*(3 + Math.random()*3), bh = px*(4 + Math.random()*4);
    const by = H*0.6 - bh;
    ctx.fillStyle = bs[i];
    ctx.fillRect(bx,by,bw,bh);
    // Windows
    ctx.fillStyle = "rgba(200,220,240,0.3)";
    const nw = 1 + Math.random()*2|0;
    for(let w=0;w<nw;w++){
      ctx.fillRect(bx+px*0.5+w*px*1.5, by+px*0.5, px*0.8, px*0.8);
      ctx.fillRect(bx+px*0.5+w*px*1.5, by+px*2, px*0.8, px*0.8);
    }
  }

  // Trees - count varies per level
  const tc = L.treeCount || 0;
  const trees = L.bg.trees;
  for(let i=0;i<tc;i++){
    const tx = W*(0.05 + (i+0.5)*(0.9/(tc+1))), ty = H*0.50 + (i%2)*H*0.04;
    ctx.fillStyle = trees[i%2];
    ctx.beginPath(); ctx.arc(tx,ty,px*2.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = trees[(i+1)%2];
    ctx.beginPath(); ctx.arc(tx+px*1.2,ty-px*0.5,px*1.5,0,Math.PI*2); ctx.fill();
    // Trunk
    ctx.fillStyle = "#6a5a3a";
    ctx.fillRect(tx-px*0.3,ty,px*0.6,px*2);
  }

  // Weather effects
  const w = L.weather || "sunny";
  if(w === "cloudy"){
    // Clouds in the sky
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    for(let i=0;i<4;i++){
      const cx = W*(0.1+i*0.28), cy = H*(0.08+Math.sin(i)*0.06), cr = px*(1.5+Math.sin(i*2)*0.5);
      ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+cr*0.8,cy-cr*0.3,cr*0.7,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx-cr*0.6,cy+cr*0.1,cr*0.6,0,Math.PI*2); ctx.fill();
    }
  } else if(w === "windy"){
    // Wind streaks
    ctx.strokeStyle = "rgba(200,200,180,0.1)"; ctx.lineWidth = px*0.08;
    for(let i=0;i<8;i++){
      const wy = H*(0.1+Math.sin(i*1.7+Date.now()*0.001)*0.35);
      ctx.beginPath(); ctx.moveTo(0,wy); ctx.lineTo(W,wy+Math.sin(i+Date.now()*0.002)*px*2); ctx.stroke();
    }
  } else if(w === "misty"){
    // Light fog overlay
    const grad = ctx.createRadialGradient(W*0.4,H*0.4,0,W*0.4,H*0.4,W*0.7);
    grad.addColorStop(0,"rgba(200,210,220,0.08)");
    grad.addColorStop(1,"rgba(200,210,220,0)");
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  }
}

function drawCharacter(c){
  if(c.dead) return;
  const x=c.x, y=c.y;
  const bob = Math.sin(c.bobPhase)*px*0.5;
  const by = y + bob;
  const s = px; // base scale unit

  // For scanned deceivers: show reveal glow
  const isRevealed = c.revealed && G.scanActive>0;

  // Body
  ctx.fillStyle = isRevealed ? "#2a1a28" : c.cloth;
  ctx.fillRect(x - s*0.7, by - s*0.2, s*1.4, s*1.8);

  // Head
  const headR = s*0.9;
  ctx.fillStyle = isRevealed ? "#1a0a18" : c.skin;
  ctx.beginPath(); ctx.arc(x, by - s*1.0, headR, 0, Math.PI*2); ctx.fill();

  // Hair
  ctx.fillStyle = isRevealed ? "#0a0008" : c.hair;
  ctx.beginPath(); ctx.arc(x, by - s*1.3, headR*0.9, Math.PI, Math.PI*2); ctx.fill();

  // Eyes
  if(isRevealed){
    // Glowing red eyes
    ctx.shadowColor = "#ff2020"; ctx.shadowBlur = 12;
    ctx.fillStyle = "#ff3030";
    ctx.beginPath(); ctx.arc(x - s*0.3, by - s*1.0, s*0.18, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + s*0.3, by - s*1.0, s*0.18, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  } else if(c.type==="villager"){
    // Normal eyes with occasional blink
    const blink = c.blinkDur > 0 ? 0.1 : 1;
    ctx.fillStyle = "#3a2a1a";
    ctx.fillRect(x - s*0.35, by - s*1.05, s*0.2 * blink, s*0.2);
    ctx.fillRect(x + s*0.15, by - s*1.05, s*0.2 * blink, s*0.2);
    // Smile
    ctx.strokeStyle = "#8a6a50"; ctx.lineWidth = px*0.15;
    ctx.beginPath(); ctx.arc(x, by - s*0.85, s*0.25, 0.15, Math.PI-0.15); ctx.stroke();
  } else {
    // Deceiver: normal-looking eyes too (camouflage)
    ctx.fillStyle = "#3a2a1a";
    ctx.fillRect(x - s*0.35, by - s*1.05, s*0.2, s*0.2);
    ctx.fillRect(x + s*0.15, by - s*1.05, s*0.2, s*0.2);
  }

  // Arms
  ctx.fillStyle = isRevealed ? "#1a0a18" : c.skin;
  ctx.fillRect(x - s*1.1, by - s*0.1, s*0.4, s*1.0);
  ctx.fillRect(x + s*0.7, by - s*0.1, s*0.4, s*1.0);

  // Legs
  ctx.fillStyle = isRevealed ? "#1a0a18" : (c.type==="villager" ? "#6a5a4a" : c.cloth);
  ctx.fillRect(x - s*0.5, by + s*1.4, s*0.4, s*0.8);
  ctx.fillRect(x + s*0.1, by + s*1.4, s*0.4, s*0.8);

  // If scanned: glowing outline
  if(isRevealed){
    ctx.strokeStyle = "rgba(255,255,200,0.6)"; ctx.lineWidth = px*0.25;
    ctx.setLineDash([px*0.4, px*0.3]); ctx.lineDashOffset = -G.scanTimer * 60;
    ctx.strokeRect(x - s*1.3, by - s*1.8, s*2.6, s*3.6);
    ctx.setLineDash([]);
    // Danger pulse
    ctx.fillStyle = `rgba(255,60,60,${0.1+0.1*Math.sin(G.scanTimer*6)})`;
    ctx.beginPath(); ctx.arc(x, by, s*2, 0, Math.PI*2); ctx.fill();
  }
}

function drawScope(cx, cy){
  const R = G.scopeR;

  // Dark vignette outside scope
  ctx.save();
  ctx.beginPath();
  ctx.rect(0,0,W,H);
  ctx.arc(cx,cy,R,0,Math.PI*2,true);
  ctx.fillStyle = "rgba(10,8,8,0.6)";
  ctx.fill("evenodd");
  ctx.restore();

  // Scope glow ring
  ctx.save();
  ctx.shadowColor = "rgba(200,220,255,0.15)"; ctx.shadowBlur = 10;
  ctx.strokeStyle = "rgba(200,220,240,0.5)"; ctx.lineWidth = Math.max(2, px*0.3);
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
  ctx.restore();

  // Inner ring (thinner)
  ctx.strokeStyle = "rgba(180,200,220,0.25)"; ctx.lineWidth = Math.max(1, px*0.15);
  ctx.beginPath(); ctx.arc(cx,cy,R*0.9,0,Math.PI*2); ctx.stroke();

  // Crosshair lines
  const len = R*0.25;
  ctx.strokeStyle = "rgba(200,220,240,0.35)"; ctx.lineWidth = Math.max(1, px*0.12);
  ctx.beginPath();
  ctx.moveTo(cx, cy-R+len); ctx.lineTo(cx, cy-R*0.5);
  ctx.moveTo(cx, cy+R-len); ctx.lineTo(cx, cy+R*0.5);
  ctx.moveTo(cx-R+len, cy); ctx.lineTo(cx-R*0.5, cy);
  ctx.moveTo(cx+R-len, cy); ctx.lineTo(cx+R*0.5, cy);
  ctx.stroke();

  // Center dot
  ctx.fillStyle = "rgba(255,100,100,0.5)";
  ctx.beginPath(); ctx.arc(cx,cy,Math.max(2, px*0.15),0,Math.PI*2); ctx.fill();
}

function drawBulletTrail(){
  if(!G.bulletTrail) return;
  const b = G.bulletTrail;
  const alpha = Math.max(0, b.life / 0.15);
  ctx.save();
  ctx.strokeStyle = `rgba(255,200,100,${alpha})`;
  ctx.lineWidth = Math.max(1.5, px*0.2);
  ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
  // Impact spark
  if(alpha>0.3){
    ctx.fillStyle = `rgba(255,220,150,${alpha*0.5})`;
    ctx.beginPath(); ctx.arc(b.x2,b.y2,Math.max(3, px*0.3),0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawMessages(){
  for(let i=G.messages.length-1;i>=0;i--){
    const m = G.messages[i];
    const alpha = Math.max(0, m.life/1.2);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `600 ${px*1.8}px -apple-system,sans-serif`;
    ctx.textAlign = "center";
    ctx.fillStyle = m.color || "#fff";
    ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 8;
    ctx.fillText(m.text, m.x, m.y - (1.2 - m.life) * 30);
    ctx.restore();
    m.life -= 1/60;
    if(m.life <= 0) G.messages.splice(i,1);
  }
}

// ============= GAME LOGIC =============
function shootAt(wx, wy){
  const now = Date.now();
  if(now - G.lastShot < 400) return; // cooldown
  G.lastShot = now;

  Audio.shoot();
  G.totalShots++;
  G.bulletTrail = { x1:G.scopeX, y1:G.scopeY, x2:wx, y2:wy, life:0.15 };

  // Find closest character within hit radius
  let closest = null, closestDist = Infinity;
  const hitR = px*2.5;
  for(const c of G.characters){
    if(c.dead) continue;
    const dx = wx - c.x, dy = wy - c.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(dist < hitR && dist < closestDist){
      closest = c; closestDist = dist;
    }
  }

  if(closest){
    if(closest.type === "deceiver"){
      closest.dead = true;
      G.hits++;
      G.score += 100 + Math.floor(G.timeLeft)*2;
      // Kill effect
      for(let i=0;i<3;i++){
        G.messages.push({
          text: ["+100","Nice!","Got 'em!","Truth!"][Math.random()*4|0],
          x:closest.x+(Math.random()-0.5)*px*3,
          y:closest.y-(Math.random()*px*2),
          life:1.0,
          color:"#f5e690"
        });
      }
      Audio.hit();
    } else {
      // Hit innocent!
      G.innocentsHit++;
      G.score = Math.max(0, G.score - 50);
      G.shake = {x:px*0.3, y:px*0.2, life:0.25};
      G.flash = 0.3;
      G.messages.push({
        text:"✗ Innocent!",
        x:closest.x,
        y:closest.y-px*2.5,
        life:1.2,
        color:"#ff6060"
      });
      Audio.harm();
    }
  } else {
    // Miss
    G.messages.push({
      text:"Miss",
      x:wx,
      y:wy-px*1.5,
      life:0.8,
      color:"#aaa"
    });
    Audio.miss();
  }

  // Check level complete (all deceivers dead)
  const aliveDeceivers = G.characters.filter(c => c.type==="deceiver" && !c.dead).length;
  if(aliveDeceivers === 0 && G.mode === "play"){
    G.mode = "clear";
    G.clearT = 0;
    G.score += Math.floor(G.timeLeft) * 5; // time bonus
    Audio.chime();
  }
}

function useScan(){
  if(G.scansLeft <= 0 || G.scanActive > 0 || G.mode !== "play") return;
  G.scansLeft--;
  G.scanActive = 2.5;
  G.scanTimer = 0;
  Audio.scan();
  // Reveal all deceivers
  for(const c of G.characters){
    if(c.type === "deceiver" && !c.dead) c.revealed = true;
  }
  updateHUD();
}

function update(dt){
  const L = LEVELS[G.level];
  if(!L) return;

  switch(G.mode){
  case "menu":
    break;
  case "intro":
    G.introT += dt;
    if(G.introT >= 1.8){
      G.mode = "play";
      // Reset stats
      G.totalShots = 0; G.hits = 0; G.innocentsHit = 0;
      updateHUD();
    }
    break;
  case "play":
    // Timer
    G.timeLeft -= dt;
    if(G.timeLeft <= 0){
      G.timeLeft = 0;
      // Check if any deceivers alive
      const aliveDeceivers = G.characters.filter(c => c.type==="deceiver" && !c.dead).length;
      if(aliveDeceivers > 0){
        G.mode = "dead";
        G.deadT = 0;
        Audio.harm();
      }
    }

    // Scan timer
    if(G.scanActive > 0){
      G.scanActive -= dt;
      G.scanTimer += dt;
      if(G.scanActive <= 0){
        G.scanActive = 0;
        // Hide reveals
        for(const c of G.characters) c.revealed = false;
      }
    }

    // Bullet trail
    if(G.bulletTrail){
      G.bulletTrail.life -= dt;
      if(G.bulletTrail.life <= 0) G.bulletTrail = null;
    }

    // Shake decay
    if(G.shake.life > 0){
      G.shake.life -= dt;
      if(G.shake.life < 0) G.shake.life = 0;
    }

    // Flash decay
    if(G.flash > 0) G.flash = Math.max(0, G.flash - dt*2);

    // Character animations
    for(const c of G.characters){
      if(c.dead) continue;
      c.bobPhase += dt * c.bobSpeed;
      // Idle sway
      c.x = c.baseX + Math.sin(c.bobPhase * 0.3) * px*0.3;
      // Blink for villagers
      if(c.type === "villager"){
        c.blinkTimer -= dt;
        if(c.blinkTimer <= 0){
          c.blinkDur = 0.12;
          c.blinkTimer = 2.5 + Math.random()*3;
        }
        if(c.blinkDur > 0) c.blinkDur -= dt;
      }
    }
    updateHUD();
    break;
  case "clear":
    G.clearT += dt;
    if(G.clearT >= 2.0) advance();
    break;
  case "dead":
    G.deadT += dt;
    if(G.deadT >= 2.0) advance();
    break;
  case "victory":
    G.victoryT += dt;
    break;
  }
}

function advance(){
  switch(G.mode){
  case "clear":
    if(G.level + 1 < LEVELS.length){
      G.level++;
      spawnLevel(G.level);  G.scopeX = W/2;  G.scopeY = H/2;
      G.mode = "intro"; G.introT = 0;
    } else {
      G.mode = "victory"; G.victoryT = 0;
      Audio.chime();
    }
    break;
  case "dead":
    // Retry same level
    spawnLevel(G.level);  G.scopeX = W/2;  G.scopeY = H/2;
    G.mode = "intro"; G.introT = 0;
    break;
  case "victory":
    G.mode = "menu";
    break;
  }
}

function drawVictory(){
  ctx.save();
  const grad = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.6);
  grad.addColorStop(0,"#2a4a38"); grad.addColorStop(1,"#1a2a20");
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  // Animated rings
  ctx.strokeStyle = `rgba(200,220,240,${0.1+0.05*Math.sin(G.victoryT*2)})`; ctx.lineWidth = 1;
  for(let i=0;i<6;i++){
    const r = 40 + i*30 + Math.sin(G.victoryT*0.5+i)*10;
    ctx.beginPath(); ctx.arc(W/2,H/2-10,r,0,Math.PI*2); ctx.stroke();
  }

  ctx.textAlign = "center";
  ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 10;

  ctx.font = `700 ${px*3}px -apple-system,sans-serif`;
  ctx.fillStyle = "#f5e6c8";
  ctx.fillText("🏆 Victory!", W/2, H*0.25);

  ctx.font = `600 ${px*1.6}px -apple-system,sans-serif`;
  ctx.fillStyle = "#c8d8b0";
  ctx.fillText("All deceivers vanquished.", W/2, H*0.35);

  ctx.font = `${px*1.4}px -apple-system,sans-serif`;
  ctx.fillStyle = "#f0e0a0";
  const accuracy = G.totalShots > 0 ? Math.round(G.hits/G.totalShots*100) : 0;
  ctx.fillText(`Final Score: ${G.score}`, W/2, H*0.46);
  ctx.fillStyle = "#b0c8b0";
  ctx.fillText(`Accuracy: ${accuracy}%  ·  Innocents Harmed: ${G.innocentsHit}`, W/2, H*0.46+px*2);

  ctx.font = `${px*1.4}px -apple-system,sans-serif`;
  ctx.fillStyle = `rgba(200,230,200,${0.4+0.4*Math.sin(G.victoryT*2.5)})`;
  ctx.fillText("Play Again", W/2, H*0.65);
  ctx.restore();
}

// ============= MAIN RENDER =============
function render(){
  const L = LEVELS[G.level];
  ctx.save();

  // Screen shake offset
  let sx=0, sy=0;
  if(G.shake.life>0){
    sx = (Math.random()-0.5)*G.shake.x;
    sy = (Math.random()-0.5)*G.shake.y;
  }
  ctx.translate(sx, sy);

  switch(G.mode){
  case "menu":
    drawMenu();
    break;

  case "intro":
    if(L){ drawLevelBg(L); for(const c of G.characters) drawCharacter(c); }
    drawIntro();
    break;

  case "play":
    if(L){
      drawLevelBg(L);
      for(const c of G.characters) drawCharacter(c);
      // Scope
      if(G.scopeX > 0 && G.scopeY > 0){
        drawScope(G.scopeX, G.scopeY);
      }
      drawBulletTrail();
      drawMessages();
      drawInGameUI();
      // Red flash on hit innocent
      if(G.flash > 0){
        ctx.fillStyle = `rgba(255,50,50,${G.flash*0.15})`;
        ctx.fillRect(-sx,-sy,W,H);
      }
    }
    break;

  case "clear":
    if(L){ drawLevelBg(L); for(const c of G.characters) drawCharacter(c); drawMessages(); }
    drawClear();
    break;

  case "dead":
    if(L){ drawLevelBg(L); for(const c of G.characters) drawCharacter(c); }
    drawDead();
    break;

  case "victory":
    drawVictory();
    break;
  }

  ctx.restore();
}

// ============= GAME LOOP =============
let lastTime = performance.now();
function loop(now){
  const dt = Math.min((now-lastTime)/1000, 0.05);
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ============= INPUT =============

// Scope follows pointer
cv.addEventListener("pointermove", e => {
  const rect = cv.getBoundingClientRect();
  G.scopeX = (e.clientX - rect.left) * (W / rect.width);
  G.scopeY = (e.clientY - rect.top) * (H / rect.height);
  // Clamp
  G.scopeX = Math.max(0, Math.min(W, G.scopeX));
  G.scopeY = Math.max(0, Math.min(H, G.scopeY));
});

// Touch/mouse click to interact
cv.addEventListener("pointerdown", e => {
  const rect = cv.getBoundingClientRect();
  const cx = (e.clientX - rect.left) * (W / rect.width);
  const cy = (e.clientY - rect.top) * (H / rect.height);
  const inScope = Math.sqrt((cx-G.scopeX)**2 + (cy-G.scopeY)**2) < G.scopeR;

  if(G.mode === "menu"){
    // Check if clicked on start button
    const btnW = px*12, btnH = px*3.5;
    const btnX = W/2 - btnW/2, btnY = H*0.58;
    if(cx >= btnX && cx <= btnX+btnW && cy >= btnY && cy <= btnY+btnH){
      Audio.tap();
      G.level = 0; G.score = 0;
      spawnLevel(0);
      G.mode = "intro"; G.introT = 0;
      updateHUD();
    }
    return;
  }

  if(G.mode === "victory"){
    Audio.tap();
    G.mode = "menu";
    return;
  }

  if(G.mode === "play"){
    shootAt(cx, cy);
    return;
  }
});

// Fire button
fireBtn.addEventListener("pointerdown", e => {
  e.preventDefault();
  if(G.mode === "play"){
    shootAt(G.scopeX, G.scopeY);
  }
});

// Scan button
scanBtn.addEventListener("pointerdown", e => {
  e.preventDefault();
  useScan();
});

// Mute
document.getElementById("mute").addEventListener("click", () => {
  const m = !Audio.isMuted();
  Audio.setMuted(m);
  document.getElementById("mute").textContent = m ? "♪̸" : "♪";
});

// Advance on tap during transition screens
cv.addEventListener("pointerup", e => {
  if(G.mode === "intro" && G.introT > 0.5){
    G.mode = "play"; G.introT = 0;
    G.totalShots = 0; G.hits = 0; G.innocentsHit = 0;
    updateHUD();
    return;
  }
  if(G.mode === "clear" && G.clearT > 0.8){
    advance();
    return;
  }
  if(G.mode === "dead" && G.deadT > 0.8){
    advance();
    return;
  }
});

// ============= START =============
requestAnimationFrame(loop);

// Expose for debugging
window.__G = G;

</script>
