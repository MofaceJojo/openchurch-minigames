<body data-page-node-id="JO9CD6pKxSusZ3Sz05L4wy">

<script src="core.js?v=8"></script>
<script src="render.js?v=8"></script>
<script src="audio.js?v=3"></script>
<script>
"use strict";
(function () {
  var cv = document.getElementById("cv");
  var SS = Core.SS;
  cv.width = Core.W * SS;
  cv.height = Core.H * SS;
  cv.style.width = Core.W + "px";
  cv.style.height = Core.H + "px";
  var ctx = cv.getContext("2d");
  ctx.scale(SS, SS);

  var savedLevel = 1;
  try { savedLevel = parseInt(localStorage.getItem("hb_best")) || 1; } catch (e) {}
  var savedDiff = "normal";
  try { savedDiff = localStorage.getItem("hb_diff") || "normal"; } catch (e) {}

  var st = Core.create(savedLevel, savedDiff);
  Audio.loadMuted();
  updateDiffButtons();

  function updateDiffButtons() {
    var btns = document.querySelectorAll("#diffSel button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle("active", btns[i].dataset.d === st.diff);
    }
  }

  /* === input === */
  var keys = {};
  function stopIfNoDir() {
    var any = keys["arrowup"] || keys["w"] || keys["up"] || keys["arrowdown"] || keys["s"] || keys["down"] ||
              keys["arrowleft"] || keys["a"] || keys["left"] || keys["arrowright"] || keys["d"] || keys["right"];
    if (!any && !st.player.trapped) Core.setPlayerDir(st, null);
  }
  function dropOrKick() {
    Audio.init();
    if (Core.kickBomb(st)) { Audio.kick(); return; }
    Core.placeBomb(st);
  }
  addEventListener("keydown", function(e) {
    var k = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].indexOf(k) >= 0) e.preventDefault();
    keys[k] = true;
    if (k === " ") dropOrKick();
    if (k === "arrowup" || k === "w") Core.setPlayerDir(st, "up");
    else if (k === "arrowdown" || k === "s") Core.setPlayerDir(st, "down");
    else if (k === "arrowleft" || k === "a") Core.setPlayerDir(st, "left");
    else if (k === "arrowright" || k === "d") Core.setPlayerDir(st, "right");
    else if (k === "enter") handleTap();
  });
  addEventListener("keyup", function(e) {
    keys[e.key.toLowerCase()] = false;
    stopIfNoDir();
  });

  var padBtns = document.querySelectorAll(".pb[data-k]");
  for (var i = 0; i < padBtns.length; i++) {
    (function(btn) {
      btn.addEventListener("touchstart", function(e) { e.preventDefault(); Audio.init(); keys[btn.dataset.k] = true;
        Core.setPlayerDir(st, btn.dataset.k); });
      btn.addEventListener("touchend", function(e) { e.preventDefault(); keys[btn.dataset.k] = false; stopIfNoDir(); });
      btn.addEventListener("mousedown", function(e) { Audio.init(); keys[btn.dataset.k] = true;
        Core.setPlayerDir(st, btn.dataset.k); });
      btn.addEventListener("mouseup", function(e) { keys[btn.dataset.k] = false; stopIfNoDir(); });
    })(padBtns[i]);
  }

  document.getElementById("bombBtn").addEventListener("touchstart", function(e) {
    e.preventDefault(); dropOrKick();
  });
  document.getElementById("bombBtn").addEventListener("mousedown", function() {
    dropOrKick();
  });

  /* keyboard hold for continuous movement */
  function checkKeyboard() {
    if (st.mode !== "play") return;
    if (st.player.trapped) return;   // 被困时按住方向键不计挣扎,只能单次按下
    if (keys["arrowup"] || keys["w"] || keys["up"]) Core.setPlayerDir(st, "up");
    else if (keys["arrowdown"] || keys["s"] || keys["down"]) Core.setPlayerDir(st, "down");
    else if (keys["arrowleft"] || keys["a"] || keys["left"]) Core.setPlayerDir(st, "left");
    else if (keys["arrowright"] || keys["d"] || keys["right"]) Core.setPlayerDir(st, "right");
  }

  /* tap on canvas */
  cv.addEventListener("click", function() { Audio.init(); handleTap(); });

  function handleTap() {
    Audio.uiClick();
    if (st.mode === "menu" || st.mode === "intro" || st.mode === "lose" || st.mode === "win") {
      Core.advance(st);
    }
  }

  /* difficulty */
  var diffBtns = document.querySelectorAll("#diffSel button");
  for (var j = 0; j < diffBtns.length; j++) {
    diffBtns[j].addEventListener("click", function() {
      Audio.init(); Audio.uiClick();
      var d = this.dataset.d;
      if (Core.setDifficulty(st, d)) {
        try { localStorage.setItem("hb_diff", d); } catch (e) {}
        updateDiffButtons();
      }
    });
  }

  /* mute */
  document.getElementById("muteBtn").addEventListener("click", function() {
    var m = Audio.toggle();
    this.textContent = m ? "♪̸" : "♪";
    this.style.opacity = m ? "0.5" : "1";
  });
  if (Audio.isMuted()) {
    var mb = document.getElementById("muteBtn");
    mb.textContent = "♪̸";
    mb.style.opacity = "0.5";
  }

  /* === game loop === */
  var last = performance.now(), acc = 0;
  var STEP_MS = 1000 / 60;

  function loop(now) {
    acc += now - last;
    last = now;
    checkKeyboard();

    while (acc >= STEP_MS) {
      var events = Core.update(st, STEP_MS);
      if (events) {
        for (var i = 0; i < events.length; i++) {
          var ev = events[i];
          if (ev.type === "explode") Audio.explode();
          else if (ev.type === "enemyDie" || ev.type === "bossDie") Audio.explode();
          else if (ev.type === "pickup") Audio.pickup();
          else if (ev.type === "hurt") Audio.hurt();
          else if (ev.type === "gameOver") Audio.die();
          else if (ev.type === "levelClear") Audio.levelClear();
          else if (ev.type === "trap") Audio.trap();
          else if (ev.type === "free") Audio.free();
        }
      }
      acc -= STEP_MS;
    }

    // 过关后进入 intro 时,把最好关卡写回本地(与 shepherd-snake / peekaboo-town 一致)
    if (st.mode === "intro") {
      try { localStorage.setItem("hb_best", st.best); } catch (e) {}
    }

    var time = (now / 1000);
    ctx.clearRect(0, 0, Core.W, Core.H);
    Render.draw(ctx, st, time, acc);

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
