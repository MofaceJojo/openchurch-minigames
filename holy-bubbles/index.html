<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Holy Bubbles · OpenChurch Games</title>
<meta name="description" content="A little pastor pops Holy Bubbles to trap cheeky imps, then pokes them to set them free. Bright, warm, free to play.">
<meta name="theme-color" content="#f3e7cf">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23047857'/%3E%3Cpath d='M10 23V15a6 6 0 0 1 12 0v8' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='10.5' r='2.1' fill='%23E0B04B'/%3E%3C/svg%3E">
<meta property="og:title" content="Holy Bubbles — an OpenChurch game">
<meta property="og:description" content="Pop the cheeky imps, clear every room. Bright, silly, free to play.">
<meta property="og:type" content="website">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#3a3028; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; touch-action:none; }
  #back {
    position:fixed; top:10px; left:10px; z-index:5;
    font:600 13px/1 -apple-system,"Segoe UI","PingFang SC",sans-serif; color:#3a5a42;
    background:rgba(255,255,255,.82); backdrop-filter:blur(4px);
    border:1px solid rgba(90,140,100,.22); border-radius:999px; padding:8px 14px; text-decoration:none;
  }
  #mute {
    position:fixed; top:10px; right:10px; z-index:5; width:38px; height:38px; border-radius:999px;
    border:1px solid rgba(90,140,100,.22); background:rgba(255,255,255,.82); backdrop-filter:blur(4px);
    font-size:17px; color:#4a6a52; cursor:pointer;
  }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; padding:6px; }
  canvas { border-radius:16px; box-shadow:0 6px 28px rgba(50,30,15,.22); touch-action:none; }

  /* 触屏控制条：虚拟十字键(左) + 圣泡按钮(右) + 戳破按钮(中下) */
  #pad {
    flex:0 0 auto; height:30vh; min-height:150px; max-height:230px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 18px calc(env(safe-area-inset-bottom,0) + 10px); gap:14px;
  }
  #dpad {
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    width:min(42vw,180px); aspect-ratio:1; gap:7px;
  }
  .d {
    border:none; border-radius:22px; background:rgba(255,248,235,0.35); color:#3a4a38;
    font-size:24px; font-weight:700; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 rgba(0,0,0,.06), inset 0 1px 4px rgba(255,255,255,0.30); user-select:none; touch-action:none;
  }
  .d:active { background:rgba(255,248,235,0.55); transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.06), inset 0 1px 4px rgba(255,255,255,0.30); }
  .up{grid-area:1/2} .left{grid-area:2/1} .right{grid-area:2/3} .down{grid-area:3/2}
  .center{grid-area:2/2; background:transparent; box-shadow:none; }
  #bomb {
    flex:0 0 auto; width:min(34vw,150px); aspect-ratio:1; border-radius:50%;
    border:none; background:radial-gradient(circle at 38% 32%, #fff0d0, #F5C868 60%, #E0B04B 100%);
    color:#5a3a10; font:700 17px/1.1 -apple-system,"Segoe UI","PingFang SC",sans-serif;
    box-shadow:0 4px 0 #b9862f, 0 6px 14px rgba(0,0,0,.14), inset 0 -3px 8px rgba(255,255,255,0.30); user-select:none; touch-action:none;
  }
  #bomb:active { transform:translateY(2px); box-shadow:0 2px 0 #b9862f, 0 3px 8px rgba(0,0,0,.14), inset 0 -1px 4px rgba(255,255,255,0.30); }
  #poke {
    flex:0 0 auto; width:min(34vw,150px); aspect-ratio:1; border-radius:50%;
    border:none; background:radial-gradient(circle at 38% 32%, #ffe0f0, #ff8ec8 60%, #ff6b9d 100%);
    color:#5a1030; font:700 15px/1.1 -apple-system,"Segoe UI","PingFang SC",sans-serif;
    box-shadow:0 4px 0 #c84a6a, 0 6px 14px rgba(0,0,0,.14), inset 0 -3px 8px rgba(255,255,255,0.30); user-select:none; touch-action:none;
    display:none; /* 仅在有被困小鬼时显示 */
  }
  #poke:active { transform:translateY(2px); box-shadow:0 2px 0 #c84a6a, 0 3px 8px rgba(0,0,0,.14), inset 0 -1px 4px rgba(255,255,255,0.30); }
  #poke.visible { display:flex; align-items:center; justify-content:center; }
  @media (hover:hover) and (pointer:fine) { #pad { opacity:.55; } #pad:hover { opacity:1; } }
</style>
</head>
<body>
<a id="back" href="../">← All games</a>
<button id="mute" aria-label="Sound">♪</button>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="pad">
  <div id="dpad">
    <button class="d up"    data-dir="0,-1">▲</button>
    <button class="d left"  data-dir="-1,0">◀</button>
    <button class="d center">●</button>
    <button class="d right" data-dir="1,0">▶</button>
    <button class="d down"  data-dir="0,1">▼</button>
  </div>
  <button id="bomb">✦ Drop</button>
  <button id="poke">✦ Poke</button>
</div>

<script src="core.js?v=2"></script>
<script src="audio-data.js?v=2"></script>
<script src="audio.js?v=2"></script>
<script src="render.js?v=2"></script>
<script>
"use strict";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const dpr = Math.min(2, window.devicePixelRatio || 1);
const stage = document.getElementById("stage");

let st = Core.create(localStorage.getItem("hb-diff"));

function fit(){
  const sw = stage.clientWidth - 12, sh = stage.clientHeight - 12;
  const px = Math.max(10, Math.floor(Math.min(sw / Core.COLS, sh / (Core.ROWS + Render.HUD_CELLS))));
  const sz = Render.canvasSize(Core, px);
  cv.width = sz.w * dpr; cv.height = sz.h * dpr;
  cv.style.width = sz.w + "px"; cv.style.height = sz.h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cv._px = px;
}
fit(); addEventListener("resize", fit);

// 音效需在用户手势里初始化
function unlockAudio(){ Sfx.init(); }
addEventListener("pointerdown", unlockAudio, { once:false, passive:true });
addEventListener("keydown", unlockAudio, { once:false });

// ---------- 键盘 ----------
const held = [];
function applyKeyDir(){
  const d = held[held.length-1];
  if (d) Core.setDir(st, d.x, d.y);
  else Core.setDir(st, 0, 0);
}
const KEYMAP = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };
addEventListener("keydown", e => {
  // 阻止所有浏览器默认行为（防止空格滚动/Alt弹菜单/浏览器快捷键）
  if (e.key !== "Alt" && e.key !== "Control" && e.key !== "Meta" && e.key !== "Shift") e.preventDefault();
  if (e.key === " " || e.code === "Space"){ e.preventDefault(); if(e.repeat) return; onAction(); return; }
  if (e.key === "p" || e.key === "P"){ e.preventDefault(); if(e.repeat) return; onPoke(); return; }
  const v = KEYMAP[e.key];
  if (v){
    const i = held.findIndex(h => h.x===v[0] && h.y===v[1]);
    if (i<0) held.push({x:v[0], y:v[1]});
    applyKeyDir();
  }
});
addEventListener("keyup", e => {
  const v = KEYMAP[e.key];
  if (v){ const i = held.findIndex(h => h.x===v[0] && h.y===v[1]); if(i>=0) held.splice(i,1); applyKeyDir(); }
});

// ---------- 触屏方向键 / 圣泡按钮 / 戳破按钮 ----------
let touchDir = null;
document.querySelectorAll(".d").forEach(btn => {
  const [dx,dy] = btn.dataset.dir.split(",").map(Number);
  const down = e => { e.preventDefault(); touchDir = {x:dx,y:dy}; Core.setDir(st, dx, dy); };
  const up   = e => { e.preventDefault(); if (touchDir && touchDir.x===dx && touchDir.y===dy) touchDir = null; Core.setDir(st, 0, 0); };
  btn.addEventListener("pointerdown", down);
  btn.addEventListener("pointerup", up);
  btn.addEventListener("pointercancel", up);
  btn.addEventListener("pointerleave", up);
});
document.getElementById("bomb").addEventListener("pointerdown", e => { e.preventDefault(); onAction(); });
document.getElementById("poke").addEventListener("pointerdown", e => { e.preventDefault(); onPoke(); });

// 点画布/中心按钮：菜单选难度/开始，其他模式推进
cv.addEventListener("pointerup", e => {
  const px = cv._px, w = cv.clientWidth, h = cv.clientHeight;
  const x = e.offsetX, y = e.offsetY;
  if (st.mode === "menu"){
    const d = Render.diffPickerHit ? Render.diffPickerHit(Core, w, h, px, x, y) : null;
    if (d){ Core.setDifficulty(st, d); localStorage.setItem("hb-diff", d); Sfx.play("chime"); return; }
    if (Render.startBtnHit && Render.startBtnHit(Core, w, h, px, x, y)){ onAction(); return; }
    return;
  }
  if (st.mode === "intro" || st.mode === "clear" || st.mode === "dead" || st.mode === "victory") onAction();
});

function onAction(){
  if (st.mode === "play") Core.placeBomb(st);
  else Core.advance(st);
}
function onPoke(){
  if (st.mode === "play") Core.tryPokeTrapped(st);
}

// 静音
const muteBtn = document.getElementById("mute");
muteBtn.addEventListener("click", () => {
  const m = !Sfx.isMuted(); Sfx.setMuted(m);
  muteBtn.textContent = m ? "♪̸" : "♪";
  muteBtn.style.color = m ? "#a33" : "#2c5c41";
});

// BGM 自动播放（在用户首次手势后）
let bgmStarted = false;
function maybeStartBgm(){
  if(!bgmStarted && !Sfx.isMuted()){
    Sfx.startBgm();
    bgmStarted = true;
  }
}
addEventListener("pointerdown", maybeStartBgm, { once:true, passive:true });
addEventListener("keydown", maybeStartBgm, { once:true });

// ---------- 主循环 ----------
let last = performance.now();
function loop(now){
  const dt = (now - last) / 1000; last = now;
  Core.update(st, dt);
  // 播放音效
  for (let i=0;i<st.sounds.length;i++){ const f = Sfx[st.sounds[i]]; if (f) f(); }
  st.sounds.length = 0;
  // 更新戳破按钮可见性
  const pokeBtn = document.getElementById("poke");
  let hasTrapped = false;
  for(let i=0;i<st.imps.length;i++) if(st.imps[i].state==="trapped"){ hasTrapped=true; break; }
  pokeBtn.classList.toggle("visible", hasTrapped && st.mode==="play");
  Render.draw(ctx, Core, st, cv._px, now/1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
