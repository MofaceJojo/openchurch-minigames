<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Imp Hunt · OpenChurch Games</title>
<meta name="description" content="Find the cheeky imps hiding in community scenes. Can you spot them all?">
<meta name="theme-color" content="#ffe8b0">
<link rel="icon" href="../assets/openchurch-cross.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #3a2f28; overflow: hidden; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { touch-action: none; border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.45); cursor: crosshair; max-width: 98vw; max-height: 94vh; }
  .ui { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 2; }
  .chip { background: rgba(255,255,255,.92); backdrop-filter: blur(6px); border: 1px solid rgba(0,0,0,.08); border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600; color: #4a3728; cursor: pointer; user-select: none; }
  .chip:hover { background: #fff; }
  #back { position: fixed; top: 12px; left: 12px; z-index: 2; text-decoration: none; }
  #sound { position: fixed; top: 12px; right: 12px; z-index: 2; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal { background: #fff8e7; border-radius: 16px; padding: 28px 32px; max-width: 420px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .modal h2 { font-size: 22px; color: #4a3728; margin-bottom: 8px; }
  .modal p { font-size: 14px; color: #6b5a4a; line-height: 1.6; margin: 6px 0; }
  .modal button { margin-top: 14px; padding: 10px 28px; border: none; border-radius: 999px; background: #e87a3a; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .modal button:hover { background: #d0692f; }
  .stars { font-size: 32px; margin: 8px 0; }
  @media (max-height: 620px) { .chip { padding: 6px 12px; font-size: 12px; } }
</style>
</head>
<body>
<a id="back" class="chip" href="../">← All games</a>
<button id="sound" class="chip">🔊 Sound</button>
<div class="ui">
<div class="chip" id="scoreChip">Found: 0 / 0</div>
<div class="chip" id="timeChip">⏱ 60s</div>
<div class="chip" id="levelChip">Level 1</div>
<div class="chip" id="hintChip">🔍 Hint (-5s)</div>
</div>
<canvas id="cv"></canvas>
<script src="audio.js?v=10"></script>
<script src="core.js?v=10"></script>
<script src="render.js?v=10"></script>
<script>
"use strict";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const soundBtn = document.getElementById("sound");
let W, H, scale = 1;

function resize() {
  const baseW = 800, baseH = 600;
  const ratio = Math.min(window.innerWidth / baseW, window.innerHeight / baseH, 1);
  scale = ratio;
  cv.width = baseW * ratio;
  cv.height = baseH * ratio;
  W = cv.width; H = cv.height;
}
window.addEventListener("resize", () => { resize(); Core.render(); });
resize();

soundBtn.onclick = () => Audio.toggle();

cv.addEventListener("click", (e) => {
  const rect = cv.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (cv.width / rect.width);
  const y = (e.clientY - rect.top) * (cv.height / rect.height);
  Core.handleClick(x / scale, y / scale);
});
cv.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = cv.getBoundingClientRect();
  const x = (t.clientX - rect.left) * (cv.width / rect.width);
  const y = (t.clientY - rect.top) * (cv.height / rect.height);
  Core.handleClick(x / scale, y / scale);
}, { passive: false });

Core.init(cv, ctx);
</script>
</body>
</html>
