<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenChurch 小游戏合集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f6f4ee; color: #24312a; font-family: -apple-system, "PingFang SC", sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 16px; }
  h1 { font-size: 28px; margin-bottom: 6px; }
  .sub { color: #6b7a70; margin-bottom: 28px; font-size: 15px; }
  .list { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 480px; }
  a.card { display: block; background: #fff; border: 1px solid #dfe6e0; border-radius: 14px; padding: 20px; text-decoration: none; color: inherit; }
  a.card:active { background: #eef4ef; }
  .card h2 { font-size: 20px; margin-bottom: 6px; }
  .card p { font-size: 14px; color: #5c6b61; line-height: 1.6; }
  .tag { display: inline-block; margin-top: 10px; font-size: 12px; padding: 3px 10px; border-radius: 10px; background: #e7f0e9; color: #3f7d5a; }
  .tag.wip { background: #f7ecd8; color: #9a7226; }
  footer { margin-top: auto; padding-top: 40px; font-size: 13px; color: #93a198; }
</style>
</head>
<body>
  <h1>✝️ OpenChurch 小游戏</h1>
  <div class="sub">即开即玩的传教主题小游戏</div>
  <div class="list">
    <a class="card" href="shepherd-snake/">
      <h2>牧者行列</h2>
      <p>牧师手持十字架走遍全地,把迷失的信徒一个个带回队伍。队伍越长,道路越难;恶魔正随关卡不断增多。</p>
      <span class="tag">v2 · 50 关 · 可玩</span>
    </a>
  </div>
  <footer>OpenChurch 出品 · openchurch.cc</footer>
</body>
</html>
