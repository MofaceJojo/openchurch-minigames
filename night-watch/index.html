<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Night Watch · OpenChurch Games</title>
<meta name="description" content="Demons hide in the pixel town wearing the colours around them. Find them, shine the light, set the people free.">
<meta name="theme-color" content="#0b1024">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23047857'/%3E%3Cpath d='M10 23V15a6 6 0 0 1 12 0v8' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='10.5' r='2.1' fill='%23E0B04B'/%3E%3C/svg%3E">
<meta property="og:title" content="Night Watch — an OpenChurch game">
<meta property="og:description" content="Spot the demons hiding in plain sight. Shine the light, set the people free.">
<meta property="og:type" content="website">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #070a16; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    touch-action: none; border-radius: 10px; cursor: crosshair;
    image-rendering: pixelated; box-shadow: 0 10px 40px rgba(0,0,0,.55);
  }
  #back {
    position: fixed; top: 12px; left: 12px; z-index: 2;
    font: 600 13px/1 -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    color: #cfe3d8; background: rgba(18,26,46,.85); backdrop-filter: blur(4px);
    border: 1px solid rgba(120,160,200,.25); border-radius: 999px;
    padding: 9px 15px; text-decoration: none;
  }
  #back:hover { background: rgba(30,42,70,.95); }
  @media (max-height: 620px) { #back { top: 6px; left: 6px; padding: 7px 12px; font-size: 12px; } }
</style>
</head>
<body>
<a id="back" href="../">← All games</a>
<canvas id="cv"></canvas>
<script src="core.js?v=2"></script>
<script src="render.js?v=2"></script>
<script>
"use strict";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let s = 3;                                   // 整数放大倍数,保持像素锐利
let cursor = null;

const st = Core.create(+(localStorage.getItem("nightwatch-level") || 1),
                       localStorage.getItem("nightwatch-diff"));

Render.setUseHint(matchMedia("(pointer: coarse)").matches
  ? "Tap a demon to drive it out" : "Click a demon to drive it out");

function fit() {
  s = Math.max(1, Math.floor(Math.min(
    (innerWidth - 16) / Core.W,
    (innerHeight - 16) / (Core.H + Render.HUD)
  )));
  const sz = Render.canvasSize(Core, s);
  cv.width = sz.w; cv.height = sz.h;
  cv.style.width = sz.w + "px"; cv.style.height = sz.h + "px";
  ctx.imageSmoothingEnabled = false;
}
fit(); addEventListener("resize", fit);

let lastFrame = 0;
function loop(now) {
  const dt = lastFrame ? Math.min(64, now - lastFrame) : 16;
  lastFrame = now;
  Core.tick(st, dt);
  Render.draw(ctx, Core, st, s, now / 1000, cursor);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* 屏幕坐标 → 虚拟像素坐标(扣掉 HUD) */
function toVirtual(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s - Render.HUD };
}

cv.addEventListener("pointermove", e => { cursor = toVirtual(e); });
cv.addEventListener("pointerleave", () => { cursor = null; });

cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  const v = toVirtual(e);
  cursor = v;
  if (st.mode === "menu") {
    const d = Render.diffPickerHit(Core, s, (e.clientX - cv.getBoundingClientRect().left),
                                            (e.clientY - cv.getBoundingClientRect().top));
    if (d) { Core.setDifficulty(st, d); localStorage.setItem("nightwatch-diff", d); return; }
  }
  if (st.mode !== "play") {
    Core.advance(st);
    if (st.mode === "intro") localStorage.setItem("nightwatch-level", st.level);
    return;
  }
  Core.shine(st, v.x, v.y);
});

addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    if (st.mode !== "play") Core.advance(st);
  }
});
</script>
</body>
</html>
