<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Peekaboo Town · OpenChurch Games</title>
<meta name="description" content="Cheeky imps hide around a sunny pixel town, painted the colour of whatever they sit on. Spot the peek, pop them away, set everyone free.">
<meta name="theme-color" content="#bfeaff">
<link rel="icon" href="../assets/openchurch-cross.png">
<meta property="og:title" content="Peekaboo Town — an OpenChurch game">
<meta property="og:description" content="Spot the cheeky imps hiding in plain sight. Pop them away and set everyone free.">
<meta property="og:type" content="website">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #cdeefb; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    touch-action: none; border-radius: 10px; cursor: crosshair;
box-shadow: 0 10px 34px rgba(60,100,120,.28);
  }
  .chip {
    position: fixed; top: 12px; z-index: 2;
    font: 600 13px/1 -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    color: #2c6b45; background: rgba(255,255,255,.9); backdrop-filter: blur(4px);
    border: 1px solid rgba(60,140,90,.25); border-radius: 999px;
    padding: 9px 15px; text-decoration: none; cursor: pointer;
  }
  #back { left: 12px; }
  #sound { right: 12px; border: 0; }
  .chip:hover { background: #fff; }
  @media (max-height: 620px) { .chip { top: 6px; padding: 7px 12px; font-size: 12px; } }
</style>
</head>
<body>
<a id="back" class="chip" href="../">← All games</a>
<button id="sound" class="chip">🔊 Sound</button>
<canvas id="cv"></canvas>
<script src="audio.js?v=10"></script>
<script src="core.js?v=10"></script>
<script src="render.js?v=10"></script>
<script>
"use strict";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const soundBtn = document.getElementById("sound");
let s = 3, cursor = null;

const st = Core.create(+(localStorage.getItem("peekaboo-level") || 1),
                       localStorage.getItem("peekaboo-diff"));

Render.setUseHint(matchMedia("(pointer: coarse)").matches
  ? "Tap an imp to pop it away" : "Click an imp to pop it away");

Sfx.setMuted(localStorage.getItem("peekaboo-muted") === "1");
function paintSoundBtn() { soundBtn.textContent = Sfx.isMuted() ? "🔇 Sound" : "🔊 Sound"; }
paintSoundBtn();
soundBtn.addEventListener("click", e => {
  e.stopPropagation();
  Sfx.init();
  Sfx.setMuted(!Sfx.isMuted());
  localStorage.setItem("peekaboo-muted", Sfx.isMuted() ? "1" : "0");
  paintSoundBtn();
  Sfx.tap();
});

/* 内部固定 2 倍超采样保持像素锐利,再用 CSS 缩放铺满屏幕 ——
   这样手机上也能占满,不受整数倍缩放限制 */
const SS = 2;
function fit() {
  s = SS;
  const sz = Render.canvasSize(Core, s);
  cv.width = sz.w; cv.height = sz.h;
  const avail = Math.min((innerWidth - 16) / Core.W,
                         (innerHeight - 16) / (Core.H + Render.HUD));
  cv.style.width = (Core.W * avail) + "px";
  cv.style.height = ((Core.H + Render.HUD) * avail) + "px";
  ctx.imageSmoothingEnabled = false;
}
fit(); addEventListener("resize", fit);

let lastFrame = 0;
function loop(now) {
  const dt = lastFrame ? Math.min(64, now - lastFrame) : 16;
  lastFrame = now;
  const wasMode = st.mode;
  const ev = Core.tick(st, dt);
  if (ev.peeked) Sfx.peek();
  if (wasMode === "play" && st.mode === "failed") Sfx.lose();
  Render.draw(ctx, Core, st, s, now / 1000, cursor);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* 屏幕坐标 → 虚拟像素坐标(按 CSS 实际显示尺寸换算,不再用 s) */
function toVirtual(e) {
  const r = cv.getBoundingClientRect();
  const k = Core.W / r.width;
  return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k - Render.HUD };
}
function toCanvasPx(e) {                    // 菜单命中判定用的画布内坐标
  const r = cv.getBoundingClientRect();
  const k = (Core.W * s) / r.width;
  return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k };
}

cv.addEventListener("pointermove", e => { cursor = toVirtual(e); });
cv.addEventListener("pointerleave", () => { cursor = null; });

cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  Sfx.init();                                     // 首次手势里初始化音频
  const v = toVirtual(e);
  cursor = v;

  if (st.mode === "menu") {
    const cp = toCanvasPx(e);
    const d = Render.diffPickerHit(Core, s, cp.x, cp.y);
    if (d) { Core.setDifficulty(st, d); localStorage.setItem("peekaboo-diff", d); Sfx.tap(); return; }
  }
  if (st.mode !== "play") {
    Core.advance(st);
    Sfx.tap();
    if (st.mode === "intro") localStorage.setItem("peekaboo-level", st.level);
    return;
  }
  // 右下角提示按钮
  if (st.mode === "play") {
    const cp = toCanvasPx(e);
    if (Render.hintBtnHit(Core, s, cp.x, cp.y)) {
      if (Core.useHint(st)) Sfx.chime ? Sfx.chime() : Sfx.tap();
      return;
    }
  }
  const res = Core.shine(st, v.x, v.y);
  if (!res) return;
  if (res.hit) {
    Sfx.catchImp();
    Sfx.freed();
    if (res.cleared) setTimeout(() => Sfx.win(), 600);
  } else {
    Sfx.miss();
    if (res.failed) setTimeout(() => Sfx.lose(), 400);
  }
});

addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    Sfx.init();
    if (st.mode !== "play") { Core.advance(st); Sfx.tap(); }
  }
});
</script>
</body>
</html>
