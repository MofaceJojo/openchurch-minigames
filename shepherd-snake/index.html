<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Shepherd's Flock · OpenChurch Mini Games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #9fcbe4; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { touch-action: none; border-radius: 10px; box-shadow: 0 6px 30px rgba(30,60,80,.25); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="core.js?v=4"></script>
<script src="render.js?v=4"></script>
<script>
"use strict";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const dpr = Math.min(2, window.devicePixelRatio || 1);
let px = 30;

const st = Core.create(+(localStorage.getItem("shepherd-level") || 1));

function fit() {
  px = Math.floor(Math.min(
    (innerWidth - 16) / Core.COLS,
    (innerHeight - 16) / (Core.ROWS + Render.HUD)
  ));
  const sz = Render.canvasSize(Core, px);
  cv.width = sz.w * dpr; cv.height = sz.h * dpr;
  cv.style.width = sz.w + "px"; cv.style.height = sz.h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fit(); addEventListener("resize", fit);

let lastTick = 0;
function loop(now) {
  if (st.mode === "play" && now - lastTick >= Core.tickMs(st.level)) {
    lastTick = now;
    Core.step(st);
    if (st.mode === "clear") localStorage.setItem("shepherd-level", Math.min(st.level + 1, Core.MAX_LEVEL));
  }
  Render.draw(ctx, Core, st, px, now / 1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function confirmOrSkill(x, y) {
  if (st.mode !== "play") { Core.advance(st); lastTick = performance.now(); return; }
  const b = Render.skillBtn(Core, px);
  if (st.skill && (x - b.x) ** 2 + (y - b.y) ** 2 <= (b.r * 1.3) ** 2) Core.useSkill(st);
}

const DIRS = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0], w: [0,-1], s: [0,1], a: [-1,0], d: [1,0] };
addEventListener("keydown", e => {
  if (e.key === " " ) { e.preventDefault(); st.mode === "play" ? Core.useSkill(st) : Core.advance(st); return; }
  if (e.key === "Enter") { if (st.mode !== "play") Core.advance(st); return; }
  const v = DIRS[e.key];
  if (v) { e.preventDefault(); if (st.mode === "play") Core.setDir(st, v[0], v[1]); }
});

cv.addEventListener("pointerdown", e => { cv._p = { x: e.offsetX, y: e.offsetY }; });
cv.addEventListener("pointerup", e => {
  const p = cv._p; if (!p) return; cv._p = null;
  const dx = e.offsetX - p.x, dy = e.offsetY - p.y;
  if (Math.abs(dx) < 16 && Math.abs(dy) < 16) return confirmOrSkill(e.offsetX, e.offsetY);
  if (st.mode !== "play") return;
  const v = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
  Core.setDir(st, v[0], v[1]);
});
</script>
</body>
</html>
