<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Shepherd's Flock · OpenChurch Games</title>
<meta name="description" content="Guide a little angel with a cross and gather lost believers. 50 levels, five holy skills. Free to play.">
<meta name="theme-color" content="#9fcbe4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23047857'/%3E%3Cpath d='M10 23V15a6 6 0 0 1 12 0v8' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='10.5' r='2.1' fill='%23E0B04B'/%3E%3C/svg%3E">
<meta property="og:title" content="Shepherd's Flock — an OpenChurch game">
<meta property="og:description" content="Gather the lost, grow your line, dodge the little demons. 50 levels, free to play.">
<meta property="og:type" content="website">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #9fcbe4; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { touch-action: none; border-radius: 10px; box-shadow: 0 6px 30px rgba(30,60,80,.25); }
  #back {
    position: fixed; top: 12px; left: 12px; z-index: 2;
    font: 600 13px/1 -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    color: #2c5c41; background: rgba(255,255,255,.82); backdrop-filter: blur(4px);
    border: 1px solid rgba(44,92,65,.22); border-radius: 999px;
    padding: 9px 15px; text-decoration: none;
  }
  #back:hover { background: #fff; }
  @media (max-height: 620px) { #back { top: 6px; left: 6px; padding: 7px 12px; font-size: 12px; } }
</style>
</head>
<body>
<a id="back" href="../">← All games</a>
<canvas id="cv"></canvas>
<script src="core.js?v=21"></script>
<script src="render.js?v=21"></script>
<script>
"use strict";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const dpr = Math.min(2, window.devicePixelRatio || 1);
let px = 30;

let seen = {};
try { seen = JSON.parse(localStorage.getItem("shepherd-seen-skills") || "{}"); } catch (e) {}
const st = Core.create(+(localStorage.getItem("shepherd-level") || 1), seen, localStorage.getItem("shepherd-diff"));

// 触屏设备只提"点按钮",带键盘的设备提空格
Render.setUseHint(
  matchMedia("(pointer: coarse)").matches ? "Tap the button to use it" : "Press SPACE or click the button",
  matchMedia("(pointer: coarse)").matches ? "Swipe or tap to continue" : "Press any arrow key to continue");

function fit() {
  px = Math.floor(Math.min(
    (innerWidth - 16) / Core.COLS,
    (innerHeight - 16) / (Core.ROWS + Render.HUD)
  ));
  const sz = Render.canvasSize(Core, px);
  cv.width = sz.w * dpr; cv.height = sz.h * dpr;
  cv.style.width = sz.w + "px"; cv.style.height = sz.h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fit(); addEventListener("resize", fit);

let lastStepAt = 0, nextStepAt = 0, lastFrame = 0;

function doStep(now) {
  lastStepAt = now;
  nextStepAt = now + Core.currentTickMs(st);
  Core.step(st);
  if (st.mode === "cheering") localStorage.setItem("shepherd-level", Math.min(st.level + 1, Core.MAX_LEVEL));
  if (st.mode === "skillIntro") localStorage.setItem("shepherd-seen-skills", JSON.stringify(st.seenSkills));
}
function resetClock() { lastStepAt = performance.now(); nextStepAt = lastStepAt + Core.currentTickMs(st); }

/* 转向即刻响应:宁可早一点,绝不迟到。
   已过半拍就立刻走,否则把下一拍提前到半拍处(最多等半拍 ≈ 100ms) */
function turn(vx, vy) {
  if (st.mode !== "play") return;
  if (!Core.setDir(st, vx, vy)) return;
  const now = performance.now(), soonest = lastStepAt + Core.currentTickMs(st) * 0.5;
  if (now >= soonest) doStep(now);
  else nextStepAt = Math.min(nextStepAt, soonest);
}

function loop(now) {
  const dt = lastFrame ? now - lastFrame : 16;
  lastFrame = now;
  if (st.mode === "play" && now >= nextStepAt) doStep(now);
  Core.tickDying(st, dt);
  Core.tickFx(st, dt);
  const span = nextStepAt - lastStepAt;
  Render.draw(ctx, Core, st, px, now / 1000, span > 0 ? (now - lastStepAt) / span : 1);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function confirmOrSkill(x, y) {
  if (st.mode === "menu") {                       // 菜单页:难度按钮 / 关卡格子
    const d = Render.diffPickerHit(Core, cv.clientWidth, cv.clientHeight, px, x, y);
    if (d) { Core.setDifficulty(st, d); localStorage.setItem("shepherd-diff", d); return; }
    const lv = Render.levelPickerHit(Core, cv.clientWidth, cv.clientHeight, px, x, y);
    if (lv) { Core.newLevel(st, lv); localStorage.setItem("shepherd-level", lv); resetClock(); return; }
  }
  if (st.mode !== "play") { Core.advance(st); resetClock(); return; }
  const b = Render.skillBtn(Core, px);
  if (st.skill && (x - b.x) ** 2 + (y - b.y) ** 2 <= (b.r * 1.3) ** 2) Core.useSkill(st);
}

const DIRS = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0], w: [0,-1], s: [0,1], a: [-1,0], d: [1,0] };
addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Spacebar" || e.code === "Space") {
    e.preventDefault();
    if (e.repeat) return;
    st.mode === "play" ? Core.useSkill(st) : Core.advance(st);
    return;
  }
  if (e.key === "Enter") { if (st.mode !== "play") Core.advance(st); return; }
  const v = DIRS[e.key];
  if (v) {
    e.preventDefault();
    // 暂停画面(关卡说明 / 技能讲解)按方向键 = 直接继续并朝该方向走
    if (st.mode === "skillIntro" || st.mode === "intro") {
      Core.advance(st); resetClock();
    }
    turn(v[0], v[1]);
  }
});

cv.addEventListener("pointerdown", e => { cv._p = { x: e.offsetX, y: e.offsetY }; });
cv.addEventListener("pointercancel", () => { cv._p = null; });
cv.addEventListener("pointerup", e => {
  const p = cv._p; if (!p) return; cv._p = null;
  const dx = e.offsetX - p.x, dy = e.offsetY - p.y;
  if (Math.abs(dx) < 16 && Math.abs(dy) < 16) return confirmOrSkill(e.offsetX, e.offsetY);
  // 暂停画面滑动 = 继续并朝该方向走
  if (st.mode === "skillIntro" || st.mode === "intro") { Core.advance(st); resetClock(); }
  if (st.mode !== "play") return;
  const v = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
  turn(v[0], v[1]);
});
</script>
</body>
</html>
