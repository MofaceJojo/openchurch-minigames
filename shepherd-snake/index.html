<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>牧者行列 · OpenChurch 小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0e1a14; color: #e8f0ea; font-family: -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px; }
  #hud { display: flex; gap: 24px; font-size: 15px; color: #a8c5b2; }
  #hud b { color: #ffd97a; }
  canvas { background: #14261c; border: 2px solid #2e4a3a; border-radius: 8px; touch-action: none; max-width: 100%; max-height: 80vh; }
  #overlay { position: fixed; inset: 0; background: rgba(10, 18, 14, .88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  #overlay h1 { font-size: 30px; color: #ffd97a; }
  #overlay p { line-height: 1.7; color: #c5d8cc; max-width: 320px; }
  #overlay button { font-size: 18px; padding: 10px 36px; border: 0; border-radius: 24px; background: #3f7d5a; color: #fff; cursor: pointer; }
  #overlay .brand { position: absolute; bottom: 18px; font-size: 12px; color: #5e7a6a; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">已拯救信徒 <b id="score">0</b><span>关卡 <b id="level">1</b></span><span>最佳 <b id="best">0</b></span></div>
  <canvas id="cv"></canvas>
</div>
<div id="overlay">
  <h1>✝️ 牧者行列</h1>
  <p id="msg">牧师手持十字架走遍全地,把迷失的信徒 🙏 一个个带回队伍 😇。<br>每拯救 5 人,恶魔 👿 便会出现阻挡你的道路。<br><br>方向键 / WASD 或滑动屏幕控制方向。</p>
  <button id="btn">开始传道</button>
  <div class="brand">OpenChurch 出品</div>
</div>
<script>
"use strict";
const COLS = 17, ROWS = 23;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
let cell = 24;

function fit() {
  cell = Math.floor(Math.min((innerWidth - 24) / COLS, (innerHeight * 0.8) / ROWS));
  cv.width = COLS * cell; cv.height = ROWS * cell;
}
fit(); addEventListener("resize", () => { fit(); draw(); });

let snake, dir, nextDir, believer, demons, rescued, level, tickMs, timer, alive;
let best = +(localStorage.getItem("shepherd-best") || 0);
$("best").textContent = best;

function freeCell(margin = 0) {
  while (true) {
    const p = { x: (Math.random() * COLS) | 0, y: (Math.random() * ROWS) | 0 };
    const nearHead = margin && Math.abs(p.x - snake[0].x) + Math.abs(p.y - snake[0].y) < margin;
    if (!nearHead && !snake.some(s => s.x === p.x && s.y === p.y) &&
        !demons.some(d => d.x === p.x && d.y === p.y) &&
        !(believer && believer.x === p.x && believer.y === p.y)) return p;
  }
}

function reset() {
  snake = [{ x: 8, y: 12 }, { x: 8, y: 13 }, { x: 8, y: 14 }];
  dir = nextDir = { x: 0, y: -1 };
  demons = []; believer = null; believer = freeCell();
  rescued = 0; level = 1; tickMs = 180; alive = true;
  $("score").textContent = 0; $("level").textContent = 1;
  clearInterval(timer); timer = setInterval(tick, tickMs);
}

function gameOver(reason) {
  alive = false; clearInterval(timer);
  if (rescued > best) { best = rescued; localStorage.setItem("shepherd-best", best); $("best").textContent = best; }
  $("msg").innerHTML = reason + "<br><br>本次拯救了 <b style='color:#ffd97a'>" + rescued + "</b> 位信徒。";
  $("btn").textContent = "再次出发";
  $("overlay").classList.remove("hidden");
}

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS)
    return gameOver("牧者走出了禾场的边界。");
  if (snake.some(s => s.x === head.x && s.y === head.y))
    return gameOver("队伍自己乱了阵脚。");
  if (demons.some(d => d.x === head.x && d.y === head.y))
    return gameOver("恶魔拦住了去路。");
  snake.unshift(head);
  if (head.x === believer.x && head.y === believer.y) {
    rescued++; $("score").textContent = rescued;
    if (rescued % 5 === 0) {
      level++; $("level").textContent = level;
      demons.push(freeCell(6));
      tickMs = Math.max(90, tickMs - 10);
      clearInterval(timer); timer = setInterval(tick, tickMs);
    }
    believer = freeCell();
  } else {
    snake.pop();
  }
  draw();
}

function glyph(ch, x, y, scale = 1) {
  ctx.font = (cell * 0.82 * scale) + "px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(ch, x * cell + cell / 2, y * cell + cell / 2 + cell * 0.04);
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = "rgba(255,255,255,.03)";
  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++)
    if ((x + y) % 2 === 0) ctx.fillRect(x * cell, y * cell, cell, cell);
  glyph("🙏", believer.x, believer.y);
  for (const d of demons) glyph("👿", d.x, d.y);
  for (let i = snake.length - 1; i > 0; i--) glyph("😇", snake[i].x, snake[i].y, 0.9);
  glyph("✝️", snake[0].x, snake[0].y, 1.1);
}

const DIRS = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0], w: [0,-1], s: [0,1], a: [-1,0], d: [1,0] };
addEventListener("keydown", e => {
  const v = DIRS[e.key];
  if (!v || !alive) return;
  e.preventDefault();
  if (v[0] !== -dir.x || v[1] !== -dir.y) nextDir = { x: v[0], y: v[1] };
});

let touchStart = null;
cv.addEventListener("touchstart", e => { touchStart = e.touches[0]; }, { passive: true });
cv.addEventListener("touchend", e => {
  if (!touchStart || !alive) return;
  const dx = e.changedTouches[0].clientX - touchStart.clientX;
  const dy = e.changedTouches[0].clientY - touchStart.clientY;
  if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
  const v = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
  if (v[0] !== -dir.x || v[1] !== -dir.y) nextDir = { x: v[0], y: v[1] };
  touchStart = null;
});

$("btn").addEventListener("click", () => {
  $("overlay").classList.add("hidden");
  reset(); draw();
});
</script>
</body>
</html>
